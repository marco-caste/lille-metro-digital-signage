                //orologio
                setInterval(orologio, 1000);
                function orologio() {
                    const d = new Date();
                    var or;
                    if (d.getMinutes()<10) {
                        if(d.getHours()<0) {
                            or="0" + d.getHours() + ":0" + d.getMinutes();
                        }
                        else{
                            or= d.getHours() + ":0" + d.getMinutes();
                        }
                    }
                    else {
                        if(d.getHours()<0) {
                            or="0" + d.getHours() + ":" + d.getMinutes();
                        }
                        else{
                            or= d.getHours() + ":" + d.getMinutes();
                        }
                    }
                    document.getElementById("ora").innerHTML = or + "&#160;";
