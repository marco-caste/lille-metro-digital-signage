<!doctype html>
<html>
	<head>
	<style>
		body {
			width: 1920px;
			height:	540px;
			margin: 0px;
		}	
		.ml2 {
 			font-weight: 900;
			font-size: 140px;
			font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
		}

		.ml2 .letter {
 			display: inline-block;
			line-height: 1em;
		}
	</style>
	</head>

	<body>
		<table>
			<tr>
				<td>
					<!-- immagine stilizzata dell'incendio -->
					<img src="FIAMMA.gif" alt="Image" style="width:450px;height:450px;">
				</td>
				<td width="80%">
					<!-- prima visualizzare il messaggio in francese, successivamente in inglese.-->
					<center><h1 class="ml2">ALARME INCENDIE FIRE ALARM</h1></center>
					<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script> <script>
						var textWrapper = document.querySelector('.ml2');
						textWrapper.innerHTML = textWrapper.textContent.replace(/\S/g, "<span class='letter'>$&</span>");

						anime.timeline({loop: true})
						.add({
							targets: '.ml2 .letter',
							scale: [4,1],
							opacity: [0,1],
							translateZ: 0,
							easing: "easeOutExpo",
							duration: 950,
							delay: (el, i) => 70*i
						}).add({
							targets: '.ml2',
							opacity: 0,
							duration: 1000,
							easing: "easeOutExpo",
							delay: 1000
						});
					</script>


				</td>
				<td>
					<!-- immagine stilizzata dell'incendio -->
					<img src="FIAMMA.gif" alt="Image" style="width:450px;height:450px;">
				</td>
			</tr>
		</table>

		<script>
			//sfondo ad intermittenza
			var n=0;
			setInterval(BgColor, 500);
			function BgColor() {
				n=n+1;
				if (n%2==0){
					document.body.style.backgroundColor = "orange";
				}
 				else {
					document.body.style.backgroundColor = "white";
				}		
			}	
		</script>
	</body>
</html>
