          <script type="text/javascript" src="stops.js"></script>
          <script>
            //numero e colore linea
            /*document.getElementById("colorline").style.backgroundColor = color;
            document.getElementById("r").style.backgroundColor = color;
            document.getElementById("nline").innerHTML = nline;*/

            //tempo
            var rand, vrand;
            setInterval(random, 1000);
            function random() {
                rand = Math.round(Math.random() * 50001 + 20000);
                vrand=rand-10000;
            }

            //pulsante stop
            var puls, col;
            function vero() {
                puls=true;
                document.getElementById("camp").play();
            }
            function falso() {
                puls=false;
            }
            function controllo() {
                if (puls==false) {
                    document.getElementById("st").style.backgroundColor = "red";
                    document.getElementById("bu").style.backgroundColor = "red";
                    document.getElementById("fnp").innerHTML="";
                    document.getElementById("bu").style.color= "white";
                }
                else {
                    document.getElementById("st").style.backgroundColor = "red";
                    document.getElementById("st").style.color= "white";
                    document.getElementById("fnp").innerHTML="Stop booked &#160;&#160;&#160;&#160;&#160;&#160; Arr&#234;t r&#233;serv&#233;";  
                    document.getElementById("bu").style.backgroundColor = "red";
                    document.getElementById("bu").style.color= "white";
                }
            }
            setInterval(controllo,1);
            falso();
            setTimeout(ciclo,10000);
            function ciclo() {
                falso();
                setInterval(falso, rand);
            }

            //orologio
            setInterval(orologio, 1);
            function orologio() {
                const d = new Date();
                var or;
                if (d.getMinutes()<10) {
                    if(d.getHours()<0) {
                        or="0" + d.getHours() + ":0" + d.getMinutes();
                    }
                    else{
                        or= d.getHours() + ":0" + d.getMinutes();
                    }
                }
                else {
                    if(d.getHours()<0) {
                        or="0" + d.getHours() + ":" + d.getMinutes();
                    }
                    else{
                        or= d.getHours() + ":" + d.getMinutes();
                    }
                }
                document.getElementById("ora").innerHTML ="&#160;" + or + "&#160;";
            }

            //sfondo ad intermittenza			
            var n=0;
            BgColor();			
            setInterval(BgColor, 500);			
            function BgColor() {
                n=n+1;
                if (n%2==0){
                    document.getElementById("fer").style.backgroundColor = "aliceblue";
                }
                 else {
                    document.getElementById("fer").style.backgroundColor = "lightgray";
                }		
            }

            //pallino
            const id1=document.getElementById("d1"), id2=document.getElementById("d2"), id3=document.getElementById("d3"), id4=document.getElementById("d4"), id5=document.getElementById("d5"), id11=document.getElementById("d11");
            const id6=document.getElementById("d6"), id7=document.getElementById("d7"), id8=document.getElementById("d8"), id9=document.getElementById("d9"), id10=document.getElementById("d10"), id12=document.getElementById("d12");
            const ids1=document.getElementById("s1"), ids2=document.getElementById("s2"), ids3=document.getElementById("s3"), ids4=document.getElementById("s4"), ids5=document.getElementById("s5"), ids11=document.getElementById("s11");
            const ids6=document.getElementById("s6"), ids7=document.getElementById("s7"), ids8=document.getElementById("s8"), ids9=document.getElementById("s9"), ids10=document.getElementById("s10"), ids12=document.getElementById("s12");
            const idrc1=document.getElementById("rc1"), idrc2=document.getElementById("rc2"), idrc3=document.getElementById("rc3"), idrc4=document.getElementById("rc4"), idrc5=document.getElementById("rc5"), idrc11=document.getElementById("rc11");
            const idrc6=document.getElementById("rc6"), idrc7=document.getElementById("rc7"), idrc8=document.getElementById("rc8"), idrc9=document.getElementById("rc9"), idrc10=document.getElementById("rc10"); idrc12=document.getElementById("rc12");
            const idr=document.getElementById("r"), idc=document.getElementById("c");
            var max;
            declare();
            function declare() {
                if  (stops[3]==null && stops[2]!=null) {max=2; idr.className= "rectangle2"; idc.style.width= "365"}
                if  (stops[4]==null && stops[3]!=null) {max=3; idr.className= "rectangle3"; idc.style.width= "275"}
                if  (stops[5]==null && stops[4]!=null) {max=4; idr.className= "rectangle4"; idc.style.width= "225"}
                if  (stops[6]==null && stops[5]!=null) {max=5; idr.className= "rectangle5"; idc.style.width= "155"}
                if  (stops[7]==null && stops[6]!=null) {max=6; idr.className= "rectangle6"; idc.style.width= "130"}
                if  (stops[8]==null && stops[7]!=null) {max=7; idr.className= "rectangle7"; idc.style.width= "115"}
                if  (stops[9]==null && stops[8]!=null) {max=8; idr.className= "rectangle8"; idc.style.width= "100"}
                if  (stops[10]==null && stops[9]!=null) {max=9; idr.className= "rectangle9"; idc.style.width= "90"}
                if  (stops[11]==null && stops[10]!=null) {max=10; idr.className= "rectangle10"; idc.style.width= "80"}
                if  (stops[12]==null && stops[11]!=null) {max=11; idr.className= "rectangle11"; idc.style.width= "70"}
                if  (stops[13]==null && stops[12]!=null) {max=12; idr.className= "rectangle12"; idc.style.width= "60"}
                if  (stops[1]!=null)  {ids1.innerHTML = stops[1]; id1.className = "circle"}
                if  (stops[2]!=null)  {ids2.innerHTML = stops[2]; id2.className = "circles"}
                if  (stops[3]!=null)  {ids3.innerHTML = stops[3]; id3.className = "circle"}
                if  (stops[4]!=null)  {ids4.innerHTML = stops[4]; id4.className = "circle"}                
                if  (stops[5]!=null)  {ids5.innerHTML = stops[5]; id5.className = "circle"}                
                if  (stops[6]!=null)  {ids6.innerHTML = stops[6]; id6.className = "circle"}                
                if  (stops[7]!=null)  {ids7.innerHTML = stops[7]; id7.className = "circle"}                
                if  (stops[8]!=null)  {ids8.innerHTML = stops[8]; id8.className = "circle"}                
                if  (stops[9]!=null)  {ids9.innerHTML = stops[9]; id9.className = "circle"}                
                if  (stops[10]!=null)  {ids10.innerHTML = stops[10]; id10.className = "circle"}
                if  (stops[11]!=null)  {ids11.innerHTML = stops[11]; id11.className = "circle"} 
                if  (stops[12]!=null)  {ids12.innerHTML = stops[12]; id12.className = "circle"}
            }
            var k=2, t=1;
            function pallino () { 
                switch(k) {
                    case 1: id1.classList.replace('circle', 'circles'); id2.classList.replace('circles', 'circle'); break;
                    case 2: id2.classList.replace('circle', 'circles'); id1.classList.replace('circles', 'circle'); id3.classList.replace('circles', 'circle'); break;
                    case 3: id3.classList.replace('circle', 'circles'); id2.classList.replace('circles', 'circle'); id4.classList.replace('circles', 'circle'); break;
                    case 4: id4.classList.replace('circle', 'circles'); id3.classList.replace('circles', 'circle'); id5.classList.replace('circles', 'circle'); break;
                    case 5: id5.classList.replace('circle', 'circles'); id4.classList.replace('circles', 'circle'); id6.classList.replace('circles', 'circle'); break;
                    case 6: id6.classList.replace('circle', 'circles'); id5.classList.replace('circles', 'circle'); id7.classList.replace('circles', 'circle'); break;
                    case 7: id7.classList.replace('circle', 'circles'); id6.classList.replace('circles', 'circle'); id8.classList.replace('circles', 'circle'); break;
                    case 8: id8.classList.replace('circle', 'circles'); id7.classList.replace('circles', 'circle'); id9.classList.replace('circles', 'circle'); break;
                    case 9: id9.classList.replace('circle', 'circles'); id8.classList.replace('circles', 'circle'); id10.classList.replace('circles', 'circle'); break;
                    case 10: id10.classList.replace('circle', 'circles'); id9.classList.replace('circles', 'circle'); break;
                }
            }
            setTimeout(scorrere, 10000);
            proxfermata();
            function proxfermata() {
                document.getElementById("arrivo").play();    
                document.getElementById("pf").innerHTML= "Next stop: " + stops[k] + "&#160;&#160;&#160;&#160;Prochaine &#233;tape : " + stops[k];
            }
            function scorrere() {
                pallino();         
                if (k==max) {
                    t=k;
                    --k;
                }
                else {
                    if (k==1) {
                        t=k;
                        ++k;
                    }
                    else {
                        if(k>t) {
                            t=k;
                            ++k;
                        }
                        else {
                            t=k;
                            --k;
                        }
                    }
                }
                document.getElementById("arrivo").play();
                setTimeout(scorrere, rand);
                setTimeout(proxfermata,vrand);
            }
            
            //traduzione
            var b=0;
            setInterval(traduzione, 2000);
            traduzione();
            function traduzione() {
                b++;
                document.getElementById("citt").innerHTML= stops[t];
                if(b%2==0) {
                    document.getElementById("benv").innerHTML= "Welcome to ";
                    document.getElementById("ri").innerHTML= "Delay:";
                }
                else {
                    document.getElementById("benv").innerHTML="Bienvenue &#224; ";
                    document.getElementById("ri").innerHTML= "Retard:";
                }
            }

            //alternanza linea-fermata
            const linid = document.getElementById("lin"), ferid = document.getElementById("fer");
            ferid.style.display = "block";
            linid.style.display = "none";
            setTimeout (lin_fer, 10000);
            function lin() {
                    ferid.style.display = "none";
                    linid.style.display = "block";
                }
            function benvenuti() {
                ferid.style.display = "block";
                linid.style.display = "none";
            }
            function lin_fer() {
                lin();
                setTimeout(benvenuti,vrand);
                setTimeout(lin_fer,rand);
            }

            //alternanza immagini-video
            const imgid = document.getElementById("img"), videoid = document.getElementById("vid");
            function switch1 () {
                imgid.src="pubblicit.jpeg";
            }
            function switch2 () {
                imgid.src="volantino.jpeg";
            }
            img_vid();
            function img_vid() {
                img();
                setTimeout(vid,20000);
                setInterval(img,30000);
                function img() {
                    imgid.style.display = "block";
                    videoid.style.display = "none";
                    switch2();
                    setTimeout(switch1,10000);
                    setTimeout(vid,20000);
                }
                function vid(){
                    imgid.style.display = "none";
                    videoid.style.display = "block";
                    videoid.play();
                }
            }

        </script>
